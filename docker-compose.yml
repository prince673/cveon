# CVEon — anonymous, client-only stack.
# Usage:  docker compose up -d --build
#
# There is intentionally NO database, NO API server, and NO cache service.
# nginx serves the static bundle and nothing else: every visitor's browser
# talks directly to the public intelligence feeds (NVD, CIRCL, EPSS, CISA KEV,
# GitHub). The operator hosts no data, records no queries, and leaves no
# trace of any CVE lookup.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    restart: unless-stopped
